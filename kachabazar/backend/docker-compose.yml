services:
  stage_webserver:
    image: nginx:latest
    container_name: stage_webserver
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - bf

  kachabazar_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kachabazar_backend
    environment:
      PUBLIC_API_URL: http://192.168.1.100
    volumes:
      - ./public:/app/public
      - uploads_data:/app/public/uploads
    restart: unless-stopped
    networks:
      - bf

volumes:
  uploads_data:

networks:
  bf:
    external: true
    name: bf
